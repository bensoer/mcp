# Number of application replicas when autoscaling is disabled.
replicaCount: 1

image:
  repository: ghcr.io/bensoer/mcp
  pullPolicy: IfNotPresent
  tag: latest

imagePullSecrets: []
nameOverride: ""

auth:
  enabled: false
  storage:
    size: 1Gi
    storageClass: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  port: 8080
  sessionAffinity: ClientIP
  sessionAffinityTimeoutSeconds: 10800

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

traefik:
  # Namespace that runs Traefik. The NetworkPolicy uses it only when the IngressRoute is enabled.
  # Kubernetes sets kubernetes.io/metadata.name to the namespace name.
  namespace: traefik
  ingressRoute:
    enabled: true
    domain: mcp.intra.soernet.ca
    issuer: letsencrypt-prod-cluster-issuer
    issuerKind: ClusterIssuer

resources:
  limits:
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 1
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 1
  periodSeconds: 5
  timeoutSeconds: 1
  failureThreshold: 3

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

tests:
  image:
    repository: mcp-e2e
    pullPolicy: Never
    tag: dev

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
