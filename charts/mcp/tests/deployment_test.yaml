suite: deployment
templates:
  - deployment.yaml
tests:
  - it: renders the secure application workload
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-helm-mcp
      - notExists:
          path: spec.replicas
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 65532
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 65532
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 65532
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsGroup
          value: 65532
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop[0]
          value: ALL
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/bensoer/mcp:latest
      - notExists:
          path: spec.template.spec.containers[0].args
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts
      - notExists:
          path: spec.template.spec.securityContext.fsGroup
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 50m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 128Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 128Mi

  - it: sets replicas when autoscaling is disabled
    set:
      autoscaling.enabled: false
      replicaCount: 2
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: renders one authenticated replica with persistent storage
    set:
      auth.enabled: true
      autoscaling.enabled: false
      volumes:
        - name: extra
          emptyDir: {}
      volumeMounts:
        - name: extra
          mountPath: /extra
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 65532
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - "-http"
            - "0.0.0.0:8080"
            - "-auth"
            - "/data/keys.db"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: keys
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /data
      - equal:
          path: spec.template.spec.volumes[0].name
          value: keys
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: RELEASE-NAME-helm-mcp-keys
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].name
          value: extra
      - equal:
          path: spec.template.spec.volumes[1].name
          value: extra
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 2
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 2

  - it: fails when authentication is enabled with autoscaling
    set:
      auth.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "Bolt allows one process only: auth.enabled requires replicaCount=1 and autoscaling.enabled=false"

  - it: fails when authentication is enabled with multiple replicas
    set:
      auth.enabled: true
      autoscaling.enabled: false
      replicaCount: 2
    asserts:
      - failedTemplate:
          errorMessage: "Bolt allows one process only: auth.enabled requires replicaCount=1 and autoscaling.enabled=false"
