suite: certificate
templates:
  - certificate.yaml
tests:
  - it: does not render when the ingress route is disabled
    set:
      traefik.ingressRoute.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a certificate for the configured domain
    asserts:
      - isKind:
          of: Certificate
      - equal:
          path: apiVersion
          value: cert-manager.io/v1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-mcp-cert
      - equal:
          path: spec.commonName
          value: mcp.intra.soernet.ca
      - equal:
          path: spec.secretName
          value: RELEASE-NAME-mcp-cert
      - equal:
          path: spec.dnsNames[0]
          value: mcp.intra.soernet.ca
      - equal:
          path: spec.issuerRef.kind
          value: ClusterIssuer
      - equal:
          path: spec.issuerRef.name
          value: letsencrypt-prod-cluster-issuer

  - it: follows the configured issuer
    set:
      traefik.ingressRoute.issuer: test-issuer
      traefik.ingressRoute.issuerKind: Issuer
    asserts:
      - equal:
          path: spec.issuerRef.kind
          value: Issuer
      - equal:
          path: spec.issuerRef.name
          value: test-issuer
