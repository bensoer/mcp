suite: ingress route
templates:
  - ingressroute.yaml
tests:
  - it: does not render when the ingress route is disabled
    set:
      traefik.ingressRoute.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: routes the configured host to the chart service
    asserts:
      - isKind:
          of: IngressRoute
      - equal:
          path: apiVersion
          value: traefik.io/v1alpha1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-helm-mcp-ingress-route
      - equal:
          path: spec.entryPoints[0]
          value: websecure
      - equal:
          path: spec.routes[0].match
          value: Host(`mcp.intra.soernet.ca`) && PathPrefix(`/`)
      - equal:
          path: spec.routes[0].services[0].name
          value: RELEASE-NAME-helm-mcp
      - equal:
          path: spec.routes[0].services[0].port
          value: 8080
      - equal:
          path: spec.routes[0].services[0].scheme
          value: http
      - equal:
          path: spec.tls.secretName
          value: RELEASE-NAME-helm-mcp-cert

  - it: targets the configured service port
    set:
      service.port: 9090
    asserts:
      - equal:
          path: spec.routes[0].services[0].port
          value: 9090
