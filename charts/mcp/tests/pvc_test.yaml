suite: persistent volume claim
templates:
  - pvc.yaml
tests:
  - it: does not render a claim when authentication is off
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a single-writer claim when authentication is enabled
    set:
      auth.enabled: true
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: RELEASE-NAME-helm-mcp-keys
      - equal:
          path: spec.accessModes[0]
          value: ReadWriteOnce
      - equal:
          path: spec.resources.requests.storage
          value: 1Gi
      - notExists:
          path: spec.storageClassName
