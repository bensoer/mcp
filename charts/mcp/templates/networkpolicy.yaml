apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mcp.fullname" . }}
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mcp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
      ports:
        - protocol: TCP
          port: 8080
    {{- if .Values.traefik.ingressRoute.enabled }}
    {{- $traefikNamespace := .Values.traefik.namespace | default "" | toString | trim }}
    {{- if not $traefikNamespace }}
    {{- fail "traefik.namespace is required when traefik.ingressRoute.enabled is true" }}
    {{- end }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $traefikNamespace }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
  egress: []
