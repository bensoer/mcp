{{- if .Values.traefik.ingressRoute.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "mcp.fullname" . }}-ingress-route
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`{{ .Values.traefik.ingressRoute.domain }}`) && PathPrefix(`/`)
      observability:
        accessLogs: true
        metrics: true
        tracing: true
      priority: 10
      services:
        - name: {{ include "mcp.fullname" . }}
          namespace: {{ .Release.Namespace }}
          passHostHeader: true
          port: {{ .Values.service.port }}
          responseForwarding:
            flushInterval: 1ms
          scheme: http
          weight: 10
  tls:
    secretName: {{ include "mcp.fullname" . }}-cert
{{- end }}
