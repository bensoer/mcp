{{- if .Values.auth.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mcp.fullname" . }}-keys
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.auth.storage.size }}
  {{- with .Values.auth.storage.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
