name: Release

# Triggered when a GitHub Release is published. Builds the container image and
# pushes it to GitHub Container Registry using the built-in GITHUB_TOKEN, then
# attaches the packaged Helm chart to the same GitHub Release.
# The chart is also pushed to oci://ghcr.io/bensoer/mcp/helm-mcp, beside the
# container image ghcr.io/bensoer/mcp. Helm uses the Chart.yaml name, helm-mcp.

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/bensoer/mcp
  CHART_REGISTRY: ghcr.io/bensoer/mcp

jobs:
  build-and-push:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate Docker to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: |
          echo "Pushed to ${{ env.IMAGE }}"
          echo "Tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"

  package-chart:
    name: Package and publish Helm chart
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package chart
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          chart_dir=$(mktemp -d)
          trap 'rm -rf "$chart_dir"' EXIT
          cp -R charts/mcp "$chart_dir/mcp"
          awk -v repository="$IMAGE" -v tag="$version" '
            /^image:$/ { in_image=1; in_tests=0; print; next }
            /^tests:$/ { in_image=0; in_tests=1; print; next }
            in_image && /^[a-zA-Z]/ { in_image=0 }
            in_image && /^  repository:/ { $0="  repository: " repository }
            in_image && /^  tag:/ { $0="  tag: " tag }
            { print }
          ' "$chart_dir/mcp/values.yaml" > "$chart_dir/values.yaml"
          mv "$chart_dir/values.yaml" "$chart_dir/mcp/values.yaml"
          # Package outside chart_dir. The EXIT trap deletes chart_dir at the
          # end of this step, before the upload step can read CHART_ASSET.
          helm package "$chart_dir/mcp" --version "$version" --app-version "$version" --destination "$RUNNER_TEMP"
          asset="$RUNNER_TEMP/helm-mcp-${version}.tgz"
          test -f "$asset"
          echo "CHART_ASSET=$asset" >> "$GITHUB_ENV"

      - name: Push chart to GHCR and attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "${CHART_ASSET:-}" || ! -f "$CHART_ASSET" ]]; then
            echo "chart asset is missing: ${CHART_ASSET:-<unset>}" >&2
            exit 1
          fi
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "$CHART_ASSET" "oci://${CHART_REGISTRY}"
          gh release upload "$GITHUB_REF_NAME" "$CHART_ASSET"
