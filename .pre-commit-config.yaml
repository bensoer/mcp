repos:
  - repo: local
    hooks:
      - id: fmt
        name: fmt
        entry: make fmt-check
        language: system
        pass_filenames: false
        always_run: true
      - id: typecheck
        name: typecheck
        entry: make typecheck
        language: system
        pass_filenames: false
        always_run: true
      - id: vet
        name: vet
        entry: make vet
        language: system
        pass_filenames: false
        always_run: true
      - id: lint
        name: lint
        entry: make lint
        language: system
        pass_filenames: false
        always_run: true
      - id: test
        name: test
        entry: make test
        language: system
        pass_filenames: false
        always_run: true
      - id: vuln
        name: vuln
        entry: make vuln
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
